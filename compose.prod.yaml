services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sigillus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-sigillus}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigillus} -d ${POSTGRES_DB:-sigillus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-sigillus}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?Defina S3_SECRET_ACCESS_KEY no .env}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio@sha256:7df55d002b698e4494a131b848dd553361bbe58b7e19f62d9623c29af1ba9ccf
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-sigillus} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET:-sigillus-media} &&
      mc anonymous set download local/$${S3_BUCKET:-sigillus-media}/public &&
      exit 0
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: sigillus-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-sigillus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sigillus}
      MIGRATE_ON_BOOT: "true"
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no .env}
      API_ORIGIN: ${API_ORIGIN:?Defina API_ORIGIN no .env}
      WEB_ORIGIN: ${WEB_ORIGIN:?Defina WEB_ORIGIN no .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Defina CORS_ORIGINS no .env}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-sigillus-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-sigillus}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?Defina S3_PUBLIC_BASE_URL no .env}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-fake}
      BILLING_FAKE_ACKNOWLEDGED: ${BILLING_FAKE_ACKNOWLEDGED:-true}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:?Defina BILLING_WEBHOOK_SECRET no .env}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Sigillus <nao-responda@sigillus.dev>}
      VERIFICATION_REQUIRED: ${VERIFICATION_REQUIRED:-false}
      VERIFICATION_DEV_CODES: ${VERIFICATION_DEV_CODES:-false}
      PREMIUM_CHECKOUT_ENABLED: ${PREMIUM_CHECKOUT_ENABLED:-false}
      OPENAPI_DOCS_ENABLED: ${OPENAPI_DOCS_ENABLED:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      SENTRY_DSN: ${SENTRY_DSN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Defina NEXT_PUBLIC_API_URL no .env}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    image: sigillus-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres-data:
  minio-data:
